version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - STP_LLMLINGUA_MODEL_NAME=microsoft/llmlingua-2-xlm-roberta-large-meetingbank
      - STP_DEVICE_MAP=cpu
      - STP_DEFAULT_COMPRESSION_MODE=balanced
      - STP_LOG_LEVEL=INFO
    volumes:
      - ./models:/app/models
    restart: unless-stopped

